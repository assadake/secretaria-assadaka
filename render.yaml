databases:
  - name: secretariat-assadaka-db
    plan: free
    databaseName: secretariat
    user: secretariat

services:
  - type: web
    name: secretariat-assadaka
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: secretariat-assadaka-db
          property: connectionString
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
