<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="نظام المراسلات والأرشفة للسكرتارية: خطابات بترويسة الشركات، أرشيف صادر قابل للبحث، اعتمادات مستندية، جداول متابعة ووثائق المجموعة — يعمل بلا إنترنت أو عبر أرشيف مشترك على الشبكة.">
<meta name="theme-color" content="#12305f">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312305f'/%3E%3Cpath d='M12 20h40v24a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V20z' fill='%23ffffff'/%3E%3Cpath d='M13 21l19 15 19-15' stroke='%23f0b400' stroke-width='4' fill='none' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<title>نظام المراسلات والأرشفة — السكرتارية</title>
<style>/*@@INCLUDE:font@@*/</style>
<style>/*@@INCLUDE:style@@*/</style>

</head>
<body>
<svg style="display:none">
  <symbol id="i-logo" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 2 7l10 5 10-5-10-5Zm0 7.5L4.5 5.8 12 4l7.5 1.8L12 9.5ZM4 10v5.5l8 4 8-4V10l-8 4-8-4Zm2 2.2 5 2.5v4.3l-5-2.5v-4.3Z"/></symbol>
</svg>

<div class="app" id="app">
  <!-- ===== Sidebar ===== -->
  <aside class="sidebar">
    <div class="brand">
      <img id="brandLogo" alt="">
      <div>
        <div class="bt">السكرتارية</div>
        <div class="bs">المراسلات والأرشفة</div>
      </div>
    </div>
    <nav class="nav" aria-label="التنقل الرئيسي">
      <button type="button" class="nav-item" data-route="dash" aria-current="page"><span class="ic" aria-hidden="true">🏠</span> لوحة التحكم</button>
      <button type="button" class="nav-item" data-route="new"><span class="ic" aria-hidden="true">📝</span> خطاب جديد</button>
      <button type="button" class="nav-item" data-route="archive"><span class="ic" aria-hidden="true">🗄️</span> الأرشيف</button>
      <button type="button" class="nav-item" data-route="credits"><span class="ic" aria-hidden="true">🏦</span> الاعتمادات المستندية</button>
      <button type="button" class="nav-item" data-route="trackers"><span class="ic" aria-hidden="true">📊</span> جداول المتابعة</button>
      <button type="button" class="nav-item" data-route="group"><span class="ic" aria-hidden="true">🗂️</span> وثائق المجموعة</button>
      <button type="button" class="nav-item" data-route="employees"><span class="ic" aria-hidden="true">👥</span> الموظفون</button>
      <button type="button" class="nav-item" data-route="companies"><span class="ic" aria-hidden="true">🏢</span> الشركات</button>
      <button type="button" class="nav-item" data-route="settings"><span class="ic" aria-hidden="true">⚙️</span> الإعدادات</button>
    </nav>
    <div class="side-foot" id="modeNote">
      نسخة محلية — البيانات محفوظة على هذا الجهاز<br>
      <span style="opacity:.75">الصداقة المثالية للأغذية · AIS</span>
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">لوحة التحكم</h1>
        <div class="sub" id="pageSub">نظرة عامة</div>
      </div>
      <div class="spacer"></div>
      <span id="updBadge" class="badge gold no-print" style="display:none;cursor:pointer"></span>
      <span id="syncBadge" class="badge grey no-print">محلي (هذا المتصفح)</span>
      <button id="logoutBtn" class="btn btn-sm no-print" style="display:none" title="تسجيل الخروج وقفل الجلسة">🔒 خروج</button>
      <div class="co-switch no-print" title="الشركة النشطة">
        <span class="lbl">الشركة:</span>
        <select id="coSwitch"></select>
      </div>
      <button class="btn btn-sm no-print" onclick="window.print()">🖨 طباعة الصفحة</button>
      <button class="btn btn-primary no-print" data-go="new">+ خطاب جديد</button>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>

<!-- منطقة الطباعة -->
<div id="printArea"></div>

<!-- نافذة منبثقة -->
<div class="modal-bg" id="modalBg"></div>
<div id="toast"></div>

<script>/*@@INCLUDE:templates@@*/</script>
<script>/*@@INCLUDE:credits@@*/</script>
<script>/*@@INCLUDE:group@@*/</script>
<script>/*@@INCLUDE:app@@*/</script>
<script>
  // ربط أزرار القائمة الجانبية
  document.querySelectorAll('.nav [data-route]').forEach(btn=>{
    btn.addEventListener('click', ()=>go(btn.dataset.route));
  });
</script>
</body>
</html>
